<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>CTA 多品种风控与清算</title>
  <style>
    body { margin: 0; font-family: "Noto Sans CJK SC", sans-serif; background: #10151c; color: #e7edf5; }
    header, main { padding: 16px 20px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    h2 { font-size: 14px; color: #93a0b0; }
    section { background: #1a222d; border: 1px solid #2c3848; border-radius: 8px; padding: 12px; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 6px 8px; border-bottom: 1px solid #2c3848; text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    .neg { color: #f0a0a0; }
    .pos { color: #7dcea0; }
    form, .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
    label { display: grid; gap: 4px; font-size: 12px; color: #93a0b0; }
    input, select, button { background: #121820; color: inherit; border: 1px solid #2c3848; border-radius: 6px; padding: 7px 8px; }
    .result { background: #121820; border-radius: 6px; padding: 10px 12px; margin-top: 12px; font-size: 13px; }
    .result p { margin: 0 0 6px; }
    .result .muted { color: #93a0b0; }
    .result table { margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>CTA 多品种风控与清算</h1>
    <div id="clock">加载中</div>
    <div id="quotes"></div>
  </header>
  <main>
    <section>
      <h2>账户</h2>
      <table>
        <thead><tr><th>账户</th><th>状态</th><th>权益</th><th>当日盯市</th><th>占初始资金</th><th>保证金</th></tr></thead>
        <tbody id="accounts"></tbody>
      </table>
    </section>
    <section>
      <h2>持仓</h2>
      <table>
        <thead><tr><th>账户</th><th>合约</th><th>方向</th><th>手数</th><th>基准价</th><th>最新</th><th>浮盈</th></tr></thead>
        <tbody id="positions"></tbody>
      </table>
    </section>
    <section>
      <h2>委托</h2>
      <form id="order-form">
        <label>账户<select id="account"></select></label>
        <label>合约<select id="instrument"></select></label>
        <label>方向<select id="side"><option value="buy">买</option><option value="sell">卖</option></select></label>
        <label>开平<select id="offset"><option value="open">开仓</option><option value="close">平仓</option></select></label>
        <label>价格<input id="price" required></label>
        <label>手数<input id="qty" type="number" min="1" value="1" required></label>
        <button type="submit">提交</button>
      </form>
      <div class="actions" style="margin-top:12px">
        <button type="button" id="live">拉取真实行情</button>
        <button type="button" id="shock">熔断验收</button>
        <button type="button" id="settle">按最新价清算</button>
        <button type="button" id="resume">解除熔断</button>
      </div>
      <div id="out" class="result">等待操作。</div>
    </section>
    <section>
      <h2>风控事件</h2>
      <table>
        <thead><tr><th>编号</th><th>账户</th><th>级别</th><th>说明</th></tr></thead>
        <tbody id="events"></tbody>
      </table>
    </section>
  </main>
  <script>
    const sideText = { long: "多", short: "空", buy: "买", sell: "卖" };
    const out = document.querySelector("#out");
    const money = (value) => Number(value).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const cls = (value) => Number(value) < 0 ? "neg" : "pos";
    const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[ch]));

    function renderOrder(data) {
      if (!data.accepted) {
        return `<p class="neg">委托被拒绝</p><p>${esc(data.reject_reason)}</p>`;
      }
      const pnl = data.realized_pnl;
      return `<p class="pos">委托已成交 ${esc(data.order_id)}</p>
        <p>成交价 ${esc(data.fill_price)}　手数 ${esc(data.fill_qty)}　平仓盯市 <span class="${cls(pnl)}">${money(pnl)}</span></p>`;
    }

    function renderBreaker(data) {
      const open = data.open_accepted
        ? `<span class="pos">成交</span>`
        : `<span class="neg">拒绝</span>　${esc(data.open_reject_reason)}`;
      const close = data.close_accepted ? `<span class="pos">成交</span>` : `<span class="neg">拒绝</span>`;
      return `<p>${esc(data.instrument)} 打到 ${esc(data.target_price)}，${data.halted ? "已熔断" : "未熔断"}</p>
        <p>当日盯市 <span class="${cls(data.daily_mtm)}">${money(data.daily_mtm)}</span></p>
        <p>开仓　${open}</p>
        <p>平仓　${close}</p>`;
    }

    function renderQuotes(data) {
      const rows = (data.quotes || []).map((quote) => `
        <tr>
          <td>${esc(quote.instrument)}</td>
          <td>${esc(quote.last)}</td>
          <td>${esc(quote.source)}</td>
          <td>${esc(String(quote.exchange_ts).replace("T", " ").slice(0, 19))}</td>
        </tr>`).join("");
      const errors = (data.errors || []).map((item) => `<p class="neg">${esc(item)}</p>`).join("");
      const body = rows || `<tr><td colspan="4">没有行情</td></tr>`;
      return `<p>行情更新 ${esc(data.changed)} 笔</p>
        <table>
          <thead><tr><th>合约</th><th>最新</th><th>来源</th><th>交易所时间</th></tr></thead>
          <tbody>${body}</tbody>
        </table>${errors}`;
    }

    function renderSettlement(data) {
      const rows = data.accounts.map((row) => `
        <tr>
          <td>${esc(row.account_id)} ${esc(row.name)}</td>
          <td>${row.halted ? "熔断" : "正常"}</td>
          <td>${money(row.equity)}</td>
          <td class="${cls(row.close_pnl)}">${money(row.close_pnl)}</td>
          <td class="${cls(row.position_pnl)}">${money(row.position_pnl)}</td>
          <td>${money(row.margin)}</td>
        </tr>`).join("");
      const positions = data.accounts.flatMap((row) => (row.positions || []).map((pos) => `
        <tr>
          <td>${esc(row.account_id)}</td>
          <td>${esc(pos.instrument)}</td>
          <td>${sideText[pos.side] || esc(pos.side)}</td>
          <td>${esc(pos.qty)}</td>
          <td class="${cls(pos.pnl)}">${money(pos.pnl)}</td>
        </tr>`)).join("");
      const book = positions
        ? `<table><thead><tr><th>账户</th><th>合约</th><th>方向</th><th>手数</th><th>盯市</th></tr></thead><tbody>${positions}</tbody></table>`
        : "";
      return `<p>清算完成　交易日 ${esc(data.trading_day)}　公司权益 ${money(data.firm_equity)}</p>
        <p class="muted">日报 ${esc(data.text_path)}</p>
        <table>
          <thead><tr><th>账户</th><th>状态</th><th>权益</th><th>平仓盯市</th><th>持仓盯市</th><th>保证金</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>${book}`;
    }

    function renderResume(data) {
      const text = data.halted ? "仍处于熔断" : "已解除熔断";
      return `<p>${esc(data.account_id)} ${text}</p>`;
    }

    function showResult(data) {
      if (data.detail) {
        out.innerHTML = `<p class="neg">${esc(typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail))}</p>`;
        return;
      }
      if ("open_accepted" in data) {
        out.innerHTML = renderBreaker(data);
        return;
      }
      if (data.quotes) {
        out.innerHTML = renderQuotes(data);
        return;
      }
      if (data.firm_equity !== undefined && data.accounts) {
        out.innerHTML = renderSettlement(data);
        return;
      }
      if ("accepted" in data) {
        out.innerHTML = renderOrder(data);
        return;
      }
      if (data.account_id && "halted" in data) {
        out.innerHTML = renderResume(data);
        return;
      }
      out.textContent = "无法显示该结果。";
    }

    function fillSelect(id, values) {
      const el = document.querySelector(id);
      const signature = values.join("|");
      if (el.dataset.signature === signature) return;
      const prev = el.value;
      el.dataset.signature = signature;
      el.innerHTML = values.map((item) => `<option>${item}</option>`).join("");
      if (values.includes(prev)) el.value = prev;
    }

    function render(data) {
      const halted = data.accounts.filter((row) => row.halted).length;
      document.querySelector("#clock").textContent = `交易日 ${data.trading_day}  ·  熔断账户 ${halted}`;
      document.querySelector("#quotes").textContent = data.quotes
        .map((row) => `${row.instrument} ${row.last} ${row.source}`)
        .join("    ");
      document.querySelector("#accounts").innerHTML = data.accounts.map((row) => `
        <tr>
          <td>${row.account_id} ${row.name}</td>
          <td>${row.halted ? "熔断" : "正常"}</td>
          <td>${money(row.equity)}</td>
          <td class="${cls(row.daily_mtm)}">${money(row.daily_mtm)}</td>
          <td class="${cls(row.daily_mtm_ratio)}">${(Number(row.daily_mtm_ratio) * 100).toFixed(2)}%</td>
          <td>${money(row.margin)}</td>
        </tr>`).join("");
      document.querySelector("#positions").innerHTML = data.positions.map((row) => `
        <tr>
          <td>${row.account_id}</td><td>${row.instrument}</td><td>${sideText[row.side] || row.side}</td>
          <td>${row.qty}</td><td>${row.mtm_basis}</td><td>${row.last}</td>
          <td class="${cls(row.floating_pnl)}">${money(row.floating_pnl)}</td>
        </tr>`).join("");
      document.querySelector("#events").innerHTML = data.events.slice().reverse().map((row) => `
        <tr><td>${row.event_id}</td><td>${row.account_id}</td><td>${row.level || ""}</td><td style="text-align:left">${row.message}</td></tr>
      `).join("");
      fillSelect("#account", data.accounts.map((row) => row.account_id));
      fillSelect("#instrument", data.quotes.map((row) => row.instrument));
      const price = document.querySelector("#price");
      if (!price.value && data.quotes.length) price.value = data.quotes[0].last;
    }

    async function refresh() {
      const response = await fetch("/api/snapshot");
      render(await response.json());
    }

    async function post(url) {
      const response = await fetch(url, { method: "POST" });
      showResult(await response.json());
      refresh();
    }

    document.querySelector("#order-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const response = await fetch("/api/orders", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          account_id: document.querySelector("#account").value,
          instrument: document.querySelector("#instrument").value,
          side: document.querySelector("#side").value,
          offset: document.querySelector("#offset").value,
          price: document.querySelector("#price").value,
          qty: Number(document.querySelector("#qty").value),
        }),
      });
      showResult(await response.json());
      refresh();
    });
    document.querySelector("#live").addEventListener("click", () => post("/api/quotes"));
    document.querySelector("#shock").addEventListener("click", () => post("/api/demo/circuit-breaker"));
    document.querySelector("#settle").addEventListener("click", () => post("/api/settlement"));
    document.querySelector("#resume").addEventListener("click", () => {
      post(`/api/accounts/${document.querySelector("#account").value || "gamma"}/resume`);
    });
    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
