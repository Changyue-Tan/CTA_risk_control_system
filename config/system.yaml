# 改这个文件即可调整品种、账户和两条风控线。
# 交易日和昨结算取 2026-10-19 仍在交易的合约。题目没有指定合约代码。
trading_day: "2026-10-19"

instruments:
  rb2701:
    exchange: SHFE
    multiplier: "10"
    margin_rate: "0.09"
    commission_per_lot: "2"
  i2701:
    exchange: DCE
    multiplier: "100"
    margin_rate: "0.12"
    commission_per_lot: "3"
  IF2612:
    exchange: CFFEX
    multiplier: "300"
    margin_rate: "0.12"
    commission_per_lot: "30"
  IC2612:
    exchange: CFFEX
    multiplier: "200"
    margin_rate: "0.14"
    commission_per_lot: "30"

accounts:
  - id: alpha
    name: 趋势策略Alpha
    initial_equity: "10000000"
  - id: beta
    name: 套利策略Beta
    initial_equity: "5000000"
  - id: gamma
    name: 验收账户Gamma
    initial_equity: "1000000"

risk:
  # 当日盯市亏损达到初始资金的 2% 告警，3% 熔断（禁止开仓，平仓仍可）。
  daily_loss_alert_ratio: "0.02"
  daily_loss_halt_ratio: "0.03"
  # 相对高水位回撤达到 5% 告警，10% 限制开仓。
  max_drawdown_alert_ratio: "0.05"
  max_drawdown_restrict_ratio: "0.10"
  # 单品种名义敞口占总敞口达到 50% 告警，70% 限制加仓（至少持有两个品种才评估）。
  concentration_alert_ratio: "0.50"
  concentration_restrict_ratio: "0.70"
  # 单品种名义本金 / 权益达到 3 倍时禁止继续加该品种。
  max_instrument_notional_ratio: "3"

# 昨仓。盯市基准是 2026-10-19 的昨结算价（东财行情 zjsj）。
bootstrap_positions:
  - account: alpha
    instrument: rb2701
    side: long
    qty: 30
    prev_settle: "3080"
  - account: alpha
    instrument: i2701
    side: short
    qty: 15
    prev_settle: "682.5"
  - account: beta
    instrument: IF2612
    side: long
    qty: 5
    prev_settle: "4076.4"
  - account: beta
    instrument: IC2612
    side: short
    qty: 4
    prev_settle: "6644.6"
  - account: gamma
    instrument: rb2701
    side: long
    qty: 20
    prev_settle: "3080"

# 开盘前最新价先放在昨结算上。页面上的「拉取真实行情」再改成两个网站的最新价。
reference_prices:
  rb2701: "3080"
  i2701: "682.5"
  IF2612: "4076.4"
  IC2612: "6644.6"
