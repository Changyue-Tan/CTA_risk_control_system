[workspace]
authors = ["Changyue Tan <tanchangyue1997@gmail.com>"]
channels = ["conda-forge"]
name = "CTA_risk_control_system"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = "3.12.*"

[pypi-dependencies]
fastapi = ">=0.115,<1"
uvicorn = ">=0.32,<1"
pyyaml = ">=6,<7"
pytest = ">=8,<9"
httpx = ">=0.27,<1"

[activation.env]
PYTHONPATH = "src"

[tasks]
test = "pytest -q"
demo = "python scripts/demo_acceptance.py"
backtest = "python scripts/run_backtest.py"
serve = "uvicorn cta_risk.app:app --host 127.0.0.1 --port 8000"
